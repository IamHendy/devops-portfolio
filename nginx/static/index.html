<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hendyogema — Users API</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header { text-align: center; margin-bottom: 36px; }
    header h1 { font-size: 1.9rem; font-weight: 600; color: #f8fafc; }
    header p  { margin-top: 8px; color: #64748b; font-size: 0.9rem; }
    .badges {
      display: flex; gap: 12px; margin-bottom: 28px;
      flex-wrap: wrap; justify-content: center;
    }
    .badge {
      display: flex; align-items: center; gap: 8px;
      background: #1e2433; border: 1px solid #2d3748;
      border-radius: 8px; padding: 8px 14px; font-size: 0.82rem;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #facc15;
    }
    .dot.ok    { background: #4ade80; animation: pulse 2s infinite; }
    .dot.error { background: #f87171; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .card {
      background: #1e2433; border: 1px solid #2d3748;
      border-radius: 12px; width: 100%; max-width: 660px;
      margin-bottom: 20px; overflow: hidden;
    }
    .card-head {
      padding: 14px 18px; border-bottom: 1px solid #2d3748;
      display: flex; justify-content: space-between; align-items: center;
    }
    .card-head h2 { font-size: 0.9rem; font-weight: 600; color: #f1f5f9; }
    .card-head span { font-size: 0.78rem; color: #475569; }
    ul.user-list { list-style: none; }
    .user-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 18px; border-bottom: 1px solid #161d2e;
      transition: background .15s;
    }
    .user-item:last-child { border-bottom: none; }
    .user-item:hover { background: #232b3e; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: #3b4fd8; display: flex; align-items: center;
      justify-content: center; font-weight: 600;
      font-size: 0.82rem; color: #c7d2fe; flex-shrink: 0;
    }
    .u-name  { font-size: 0.88rem; font-weight: 500; color: #e2e8f0; }
    .u-email { font-size: 0.78rem; color: #64748b; margin-top: 2px; }
    .u-id    { font-size: 0.72rem; color: #334155; font-family: monospace; }
    .empty   { padding: 28px 18px; text-align: center; color: #475569; font-size: 0.88rem; }
    .add-form { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
    input {
      background: #0f1117; border: 1px solid #2d3748; border-radius: 8px;
      padding: 9px 13px; color: #e2e8f0; font-size: 0.88rem; outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #4f6ef7; }
    button {
      background: #4f6ef7; color: #fff; border: none;
      border-radius: 8px; padding: 9px; font-size: 0.88rem;
      font-weight: 500; cursor: pointer; transition: background .15s;
    }
    button:hover { background: #3b5bdb; }
  </style>
</head>
<body>
  <header>
    <h1>devops-portfolio.strangled.net</h1>
    <p>Docker + Nginx + Node.js running on DigitalOcean </p>
    <p>Deployed automatically to Droplet via Github Actions</p>
  </header>

  <div class="badges">
    <div class="badge">
      <div class="dot" id="health-dot"></div>
      <span id="health-label">Checking server...</span>
    </div>
    <div class="badge">
      <div class="dot" id="api-dot"></div>
      <span id="api-label">Checking API...</span>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>Users</h2>
      <span id="user-count">—</span>
    </div>
    <ul class="user-list" id="user-list">
      <li class="empty">Loading...</li>
    </ul>
  </div>

  <div class="card">
    <div class="card-head"><h2>Add a user</h2></div>
    <div class="add-form">
      <input id="inp-name"  type="text"  placeholder="Full name" />
      <input id="inp-email" type="email" placeholder="Email address" />
      <button onclick="addUser()">Add user</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
