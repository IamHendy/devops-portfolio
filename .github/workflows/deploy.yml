name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  ci:
    name: Check code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: Check syntax
        run: |
          node --check app/src/server.js
          node --check app/src/app.js
          node --check app/src/routes/users.js
          node --check app/src/middleware/errorHandler.js
          node --check app/src/middleware/requestLogger.js
          node --check app/config/env.js

      - name: Verify app starts
        run: |
          cd app
          NODE_ENV=production \
          PORT=3000 \
          HOST=0.0.0.0 \
          APP_NAME=users-api \
          APP_VERSION=1.0.0 \
          CORS_ORIGIN=http://localhost \
          timeout 10 node src/server.js &
          sleep 4
          curl -f http://localhost:3000/health
          curl -f http://localhost:3000/api/v1/users

  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd ~/devops-portfolio
            git pull origin main
            docker compose down --remove-orphans
            docker compose build --no-cache
            docker compose up -d
            sleep 20
            curl -f http://localhost/health || exit 1
            echo "Deployment successful"